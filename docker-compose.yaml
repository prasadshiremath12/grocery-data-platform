# Local Airflow console for development/testing against a REAL GCP project (BigQuery + Dataflow + GCS).
#   1. Create a service account key with the roles in scripts/deploy_composer.sh and save it as ./keys/sa.json
#   2. cp .env.example .env   (set GCP_PROJECT / GCS_BUCKET)
#   3. docker compose up -d   ->  http://localhost:8080   (user: admin, password: admin)
# Production uses Cloud Composer instead (scripts/deploy_composer.sh) - same DAG, same console.
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "airflow"], interval: 5s, retries: 10}

  airflow:
    image: apache/airflow:2.9.3-python3.11
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8080:8080"]
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor            # lets parallel tasks (sensors, loads, checks) really run in parallel
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/sa.json
      AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: google-cloud-platform://?extra__google_cloud_platform__key_path=/opt/airflow/keys/sa.json
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-google google-cloud-bigquery"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/dags/grocery_platform/pipeline:ro
      - ./campaign:/opt/airflow/dags/grocery_platform/campaign:ro
      - ./sql:/opt/airflow/dags/grocery_platform/sql:ro
      - ./setup.py:/opt/airflow/dags/grocery_platform/setup.py:ro
      - ./pipeline_launcher.py:/opt/airflow/dags/grocery_platform/pipeline_launcher.py:ro
      - ./keys:/opt/airflow/keys:ro
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com || true;
               airflow variables set send_emails false;
               airflow scheduler & exec airflow webserver"

volumes:
  pgdata:
